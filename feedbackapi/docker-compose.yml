# Banco SQL Server local para testar a API.
#
# Uso:
#   docker compose up -d
#   DB_PASSWORD='Feedback@Local123' ./mvnw spring-boot:run
#
# Para trocar a senha: DB_PASSWORD='OutraSenha@123' docker compose up -d
# (mínimo 8 caracteres, com maiúsculas, minúsculas, números e símbolos)

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: feedbackapi-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-Feedback@Local123}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Cria o banco TechChallenge (o ddl-auto da aplicação cria só as tabelas).
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: feedbackapi-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-Feedback@Local123}
    entrypoint:
      - /bin/bash
      - -c
      - >
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b
        -Q "IF DB_ID('TechChallenge') IS NULL CREATE DATABASE TechChallenge"
        && echo 'Banco TechChallenge pronto.'
    restart: "no"

volumes:
  sqlserver-data:

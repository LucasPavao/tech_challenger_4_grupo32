spring.application.name=api-evaluations

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=TechChallenge;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.idle-timeout=60000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db

# Integracao com a Azure Function Serverless de Alertas (Pessoa 3)
alerts.function.url=${ALERTS_FUNCTION_URL:}
alerts.function.key=${ALERTS_FUNCTION_KEY:}

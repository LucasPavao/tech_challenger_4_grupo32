name: Deploy - function-alerts (critical-alerts)

on:
  push:
    branches: [main]
    paths:
      - 'function-alerts/**'
      - '.github/workflows/deploy-alerts.yml'
  workflow_dispatch:            # permite redeploy manual (Actions > Run workflow)

# Necessario para o login OIDC no Azure
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-alerta
  cancel-in-progress: false

env:
  MODULE_DIR: function-alerta
  AZURE_FUNCTIONAPP_NAME: critical-alerts
  JAVA_VERSION: '21'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build
        run: mvn -B clean package -DskipTests --file ${{ env.MODULE_DIR }}/pom.xml
        # Testes ja rodaram no CI do Pull Request

      - name: Localizar pasta de pacote da Function
        id: pkg
        run: |
          # O azure-functions-maven-plugin gera target/azure-functions/<appName do pom>/
          DIR=$(ls -d ${{ env.MODULE_DIR }}/target/azure-functions/*/ | head -n 1)
          echo "path=${DIR%/}" >> "$GITHUB_OUTPUT"
          echo "Pacote: $DIR"

      - name: Login no Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy na Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ steps.pkg.outputs.path }}
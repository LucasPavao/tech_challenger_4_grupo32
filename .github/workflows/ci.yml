name: CI

# Roda em todo Pull Request para a main: compila e testa cada modulo.
# Configure este workflow como "required status check" na protecao da main.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build e testes (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [api, function-alerts, function-reports]
    steps:
      - uses: actions/checkout@v4

      - name: Verifica se o modulo ja tem codigo
        id: has_code
        run: |
          if [ -f "${{ matrix.module }}/pom.xml" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Sem pom.xml em ${{ matrix.module }}, pulando"
          fi

      - uses: actions/setup-java@v4
        if: steps.has_code.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build + testes
        if: steps.has_code.outputs.ok == 'true'
        run: mvn -B verify --file ${{ matrix.module }}/pom.xml

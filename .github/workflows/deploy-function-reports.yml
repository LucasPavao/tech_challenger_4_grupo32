# Docs for the Azure Functions Action: https://github.com/Azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Azure Function - function-reports

on:
  push:
    branches:
      - 'main'
    paths:
      - 'function-reports/**'
      - '.github/workflows/deploy-function-reports.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: 'maven'
          cache-dependency-path: 'function-reports/pom.xml'

      - name: Build with Maven
        run: mvn -B -f function-reports/pom.xml clean package

      - name: Prepare function staging directory
        run: |
          FUNC_DIR=$(find function-reports/target/azure-functions -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -z "$FUNC_DIR" ]; then
            echo "No Azure Function build directory found in function-reports/target/azure-functions"
            exit 1
          fi
          mv "$FUNC_DIR" staging

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: function-reports-app
          path: staging

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # This is required for requesting the JWT (OIDC)
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: function-reports-app
          path: package

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_REPORTS }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID_REPORTS }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_REPORTS }}

      - name: Deploy to Azure Functions
        id: deploy-to-function
        uses: Azure/functions-action@v1
        with:
          app-name: 'function-reports' # Substituir pelo nome real da Function App no Azure
          package: 'package'
